# cargo-deny: licences, bans, advisories and sources of the dependency graph.
# scripts/check.sh runs `cargo deny --all-features check`.

[graph]
all-features = true

[advisories]
version = 2
# Vulnerabilities, unsound and unmaintained crates are errors (the version 2
# defaults), and so is a yanked release: no warning is tolerated.
yanked = "deny"
ignore = [
    # The Marvin attack on the rsa crate (every release): timing leaks in the operations
    # with an RSA private key (decryption, signing). The crate is only used by the TLS
    # client of the feature `fetch` of einvoice-validator to verify signatures with the
    # public keys of servers and certificate authorities, which hold nothing secret: no
    # private key is ever loaded (src/rulesets/fetch/tls.rs).
    { id = "RUSTSEC-2023-0071", reason = "rsa verifies signatures with public keys only: the timing leak concerns private-key operations, never run" },
]

[licenses]
version = 2
# Exactly what the graph uses today (check with `cargo deny list`), so that a
# crate under a new licence is a decision recorded here rather than something
# a broad allow-list lets through. Permissive licences only.
allow = [
    "MIT",
]
# Deliberately absent: GPL, LGPL, MPL and other copyleft licences.
confidence-threshold = 0.8
# Dev-dependencies are part of the licence check too.
include-dev = true
# einvoice-xsd embeds the OASIS UBL 2.1 and UN/CEFACT CII D16B schemas, which keep the
# terms in their own headers (crates/einvoice-xsd/schemas/*/README.md, texts in
# crates/einvoice-xsd/LICENSES/). einvoice-validator vendors the CEN EN 16931
# stylesheets (EUPL-1.2), embedded by its default features `cen-ubl` and `cen-cii`
# (crates/einvoice-validator/bundles/*/README.md), and every build of it embeds the UBL
# and CII schemas through einvoice-xsd; the einvoice-cli binary and the einvoice-wasm module
# embed both. Allowed for those four crates only, not for the graph.
exceptions = [
    { crate = "einvoice-xsd", allow = [
        "LicenseRef-OASIS-Copyright-Notice",
        "LicenseRef-UN-CEFACT-Copyright-Notice",
        "W3C-19980720",
    ] },
    { crate = "einvoice-validator", allow = [
        "EUPL-1.2",
        "LicenseRef-OASIS-Copyright-Notice",
        "LicenseRef-UN-CEFACT-Copyright-Notice",
        "W3C-19980720",
    ] },
    { crate = "einvoice-cli", allow = [
        "EUPL-1.2",
        "LicenseRef-OASIS-Copyright-Notice",
        "LicenseRef-UN-CEFACT-Copyright-Notice",
        "W3C-19980720",
    ] },
    { crate = "einvoice-wasm", allow = [
        "EUPL-1.2",
        "LicenseRef-OASIS-Copyright-Notice",
        "LicenseRef-UN-CEFACT-Copyright-Notice",
        "W3C-19980720",
    ] },
    # unicode-ident is "(MIT OR Apache-2.0) AND Unicode-3.0" (its tables derive from the
    # Unicode Character Database). In the graph only for building einvoice-wasm: the
    # wasm-bindgen macros (wasm-bindgen-macro-support, through proc-macro2 and syn) run
    # on the build machine and use it, and so do the identifier checks of
    # wasm-bindgen-shared, which only those macros call. None of its code is in the
    # WebAssembly module (no unicode_ident symbol among the function names of a release
    # build). Allowed for that crate only. Its notice is in
    # crates/einvoice-wasm/THIRD-PARTY-NOTICES all the same, which covers the whole graph
    # of normal dependencies of the module.
    { crate = "unicode-ident", allow = ["Unicode-3.0"] },
    # The HTTPS client of the feature `fetch` of einvoice-validator (on by default in
    # einvoice-cli, never built for WebAssembly), which downloads the rule sets that are
    # not redistributed: rustls itself is "Apache-2.0 OR ISC OR MIT" (MIT chosen), and so
    # are the RustCrypto crates of its cryptography (MIT chosen); its certificate
    # verification and two helpers come under permissive licences without an MIT
    # alternative: rustls-webpki and untrusted are ISC; subtle (constant-time
    # comparisons, also used by the RustCrypto crates) is BSD-3-Clause; the Mozilla root
    # certificates of webpki-roots are data under CDLA-Permissive-2.0. Each allowed for
    # its crate only; their texts are in crates/einvoice-cli/THIRD-PARTY-NOTICES.
    { crate = "rustls-webpki", allow = ["ISC"] },
    { crate = "untrusted", allow = ["ISC"] },
    { crate = "subtle", allow = ["BSD-3-Clause"] },
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "deny"
# Same for duplicates: dev-dependencies count.
multiple-versions-include-dev = true
wildcards = "deny"
# Workspace members depend on each other by path.
allow-wildcard-paths = true
highlight = "all"
skip = []
# No C, C++ or assembly is built or linked: the crates that compile or link native code
# from a build script (C compiler drivers, CMake, bindings generators, system-library
# finders, the -sys crates of C libraries, and the crypto libraries made of C and
# assembly) are refused everywhere in the graph, dev-dependencies and the tooling of
# xtask included, for every target. None is needed: no build script of the graph
# compiles anything but Rust probes (docs/dependencies.md lists them, and
# crates/einvoice-testkit/tests/supply_chain.rs checks the packages themselves). The
# same list is NATIVE_BUILD_CRATES in crates/einvoice-testkit/src/supply_chain.rs.
deny = [
    { crate = "autotools", reason = "builds C with autotools" },
    { crate = "aws-lc-fips-sys", reason = "C and assembly (AWS-LC)" },
    { crate = "aws-lc-rs", reason = "C and assembly (AWS-LC)" },
    { crate = "aws-lc-sys", reason = "C and assembly (AWS-LC)" },
    { crate = "bindgen", reason = "generates bindings to C libraries" },
    { crate = "boring-sys", reason = "C and assembly (BoringSSL)" },
    { crate = "bzip2-sys", reason = "C (libbzip2)" },
    { crate = "cc", reason = "compiles C, C++ and assembly" },
    { crate = "cmake", reason = "builds C and C++ with CMake" },
    { crate = "cxx", reason = "C++ interoperability" },
    { crate = "cxx-build", reason = "compiles C++" },
    { crate = "libz-sys", reason = "C (zlib)" },
    { crate = "lzma-sys", reason = "C (liblzma)" },
    { crate = "nasm-rs", reason = "assembles with NASM" },
    { crate = "openssl-src", reason = "C and assembly (OpenSSL)" },
    { crate = "openssl-sys", reason = "C (OpenSSL)" },
    { crate = "pkg-config", reason = "finds system C libraries to link" },
    { crate = "ring", reason = "C and assembly (BoringSSL-derived)" },
    { crate = "sha1-asm", reason = "assembly" },
    { crate = "sha2-asm", reason = "assembly" },
    { crate = "system-deps", reason = "finds system C libraries to link" },
    { crate = "vcpkg", reason = "finds C libraries to link" },
    { crate = "zstd-sys", reason = "C (zstd)" },
]

[sources]
# Only crates.io. A git or alternative-registry dependency is a supply-chain
# decision, not a warning.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
