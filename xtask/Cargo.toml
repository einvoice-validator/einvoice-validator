[package]
name = "xtask"
description = "Repository tooling: vendored artefact manifests, test corpus extraction and the Saxon-HE oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
einvoice-svrl = { path = "../crates/einvoice-svrl", version = "0.2.0" }
roxmltree = "0.21.2"
sha2 = "0.11.1"

# `cargo xtask bench`: the CPU time and peak memory of a measured process
# (getrusage), without unsafe code here.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[lints]
workspace = true
