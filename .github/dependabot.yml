# Weekly version updates, one grouped pull request per ecosystem. Security
# updates are not delayed by the cooldown. Pins outside these ecosystems
# (official rule sets, Saxon-HE, the toolchain, CI tools) are checked by
# .github/workflows/freshness.yml against upstream.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    labels: [dependencies, no-changelog]
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      cargo:
        patterns: ["*"]
    # Major versions change APIs; they are migrated by hand, tracked in an issue.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
    labels: [dependencies, no-changelog]
    cooldown:
      default-days: 7
