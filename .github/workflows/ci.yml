name: ci

# Every check runs through scripts/check.sh, so CI and a local run execute the
# same commands. Jobs:
#   rust       fmt, cargo-deny, clippy, doc, test on Linux (one build), then
#              einvoice-validator without its default features and built for
#              wasm32-unknown-unknown, the wasm examples of
#              einvoice-xpath-eval and einvoice-validator run under wasmtime,
#              and the publishable crates packaged and built from their
#              packages
#   test       tests on macOS and Windows, pull requests and manual runs only,
#              after the Linux job has passed
#   workflows  actionlint, and zizmor on .github/workflows and
#              .github/dependabot.yml; the pins of upstream.toml and the
#              tests of scripts/freshness.sh; ShellCheck on every script and
#              git hook, and the tests of the privacy guard and of the release
#              scripts
#   ci-ok      fails unless every job above passed: the single status check
#              to require for branch protection

on:
  # No path filter on pull requests: ci-ok must always report, since it is
  # the required check.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Transient download failures (HTTP 5xx, resets) are retried: cargo for the
  # crates, rustup for the toolchain (both default to 3 attempts).
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: rust (fmt, deny, clippy, doc, test, features, wasm, package)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # https://github.com/EmbarkStudios/cargo-deny/releases/tag/0.20.2
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
      # https://github.com/bytecodealliance/wasmtime/releases/tag/v50.0.1
      WASMTIME_VERSION: 50.0.1
      WASMTIME_SHA256: 685466455dd42a14774a86c36c8f2e45cbb9bd6d92a850139315df60a75498a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release archives of cargo-deny and wasmtime, keyed by their pins.
      # A cached archive is never trusted: the install steps check it against
      # its pinned SHA-256 and download it again when it does not match.
      - name: Cache the tool archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: tools-${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ env.CARGO_DENY_SHA256 }}-wasmtime-${{ env.WASMTIME_VERSION }}-${{ env.WASMTIME_SHA256 }}
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: scripts/check.sh toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt
        run: scripts/check.sh fmt
      - name: Install cargo-deny (pinned version and checksum)
        if: ${{ !cancelled() }}
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/downloads/$name.tar.gz"
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/bin"
          if ! echo "${CARGO_DENY_SHA256}  $archive" | sha256sum -c --status - 2>/dev/null; then
            rm -f "$archive"
            curl --proto '=https' --tlsv1.2 -fsSL \
              --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -o "$archive" \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$name.tar.gz"
          fi
          echo "${CARGO_DENY_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/cargo-deny"
      - name: deny
        if: ${{ !cancelled() }}
        run: PATH="$RUNNER_TEMP/bin:$PATH" scripts/check.sh deny
      - name: clippy
        if: ${{ !cancelled() }}
        run: scripts/check.sh clippy
      - name: doc
        if: ${{ !cancelled() }}
        run: scripts/check.sh doc
      - name: test
        if: ${{ !cancelled() }}
        run: scripts/check.sh test
      - name: features
        if: ${{ !cancelled() }}
        run: scripts/check.sh features
      # rustup adds the target to the toolchain of rust-toolchain.toml.
      - name: Install the wasm32-unknown-unknown target
        if: ${{ !cancelled() }}
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasmtime (pinned version and checksum)
        if: ${{ !cancelled() }}
        run: |
          name="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          archive="$RUNNER_TEMP/downloads/$name.tar.xz"
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/bin"
          if ! echo "${WASMTIME_SHA256}  $archive" | sha256sum -c --status - 2>/dev/null; then
            rm -f "$archive"
            curl --proto '=https' --tlsv1.2 -fsSL \
              --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -o "$archive" \
              "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/$name.tar.xz"
          fi
          echo "${WASMTIME_SHA256}  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP/bin" --strip-components=1 "$name/wasmtime"
      - name: wasm
        if: ${{ !cancelled() }}
        run: PATH="$RUNNER_TEMP/bin:$PATH" scripts/check.sh wasm
      - name: package
        if: ${{ !cancelled() }}
        run: scripts/check.sh package

  test:
    name: test (${{ matrix.os }})
    needs: rust
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: scripts/check.sh toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: test
        run: scripts/check.sh test

  workflows:
    name: workflows (actionlint, zizmor, pins, scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # https://github.com/rhysd/actionlint/releases/tag/v1.7.12
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release archive of actionlint, keyed by its pin; checked against
      # its pinned SHA-256 by the install step, like a fresh download.
      - name: Cache the actionlint archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/downloads
          key: tools-${{ runner.os }}-actionlint-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}
      - name: Install actionlint (pinned version and checksum)
        run: |
          name="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/downloads/$name"
          mkdir -p "$RUNNER_TEMP/downloads" "$RUNNER_TEMP/bin"
          if ! echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c --status - 2>/dev/null; then
            rm -f "$archive"
            curl --proto '=https' --tlsv1.2 -fsSL \
              --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -o "$archive" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$name"
          fi
          echo "${ACTIONLINT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
      - name: actionlint
        run: PATH="$RUNNER_TEMP/bin:$PATH" scripts/check.sh actionlint
      # Same audit as `scripts/check.sh zizmor`; the action installs zizmor
      # from wheels pinned by hash in its own tree.
      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          inputs: .github/workflows .github/dependabot.yml
          persona: pedantic
          advanced-security: false
          annotations: true
      # Offline: every pin of upstream.toml against the files that record it.
      - name: pins
        if: ${{ !cancelled() }}
        run: scripts/check.sh pins
      # ShellCheck on scripts/ and .githooks/; the privacy guard on a synthetic
      # term list and the release scripts in throw-away repositories.
      - name: guards
        if: ${{ !cancelled() }}
        run: scripts/check.sh guards

  ci-ok:
    name: ci-ok
    needs: [rust, test, workflows]
    # Runs even when a needed job failed or was cancelled, so that this check
    # fails instead of being skipped (a skipped required check counts as passed).
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RUST: ${{ needs.rust.result }}
          TEST: ${{ needs.test.result }}
          WORKFLOWS: ${{ needs.workflows.result }}
        run: |
          echo "rust=$RUST test=$TEST workflows=$WORKFLOWS"
          [ "$RUST" = success ] || exit 1
          [ "$WORKFLOWS" = success ] || exit 1
          # The macOS/Windows tests are skipped on pushes to main.
          case "$TEST" in success | skipped) ;; *) exit 1 ;; esac
