name: oracle

# Re-runs the reference oracle through `scripts/check.sh oracle`: checks the
# vendored artefacts against their SHA256SUMS and the extracted corpus against
# the vendored test sets, runs Saxon-HE on every corpus case and fails if the
# committed goldens differ, then cross-checks the goldens with the VEFA
# expectations; then xmllint (libxml2) on the oracle cases of einvoice-xsd,
# whose results must not change; then the Saxon goldens of einvoice-xdm,
# einvoice-xpath-eval and einvoice-xslt-exec, and Saxon-HE on the hand-written
# cases of einvoice-xml (its saxon-check example).
# Only runs when one of those inputs or the tooling changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "artefacts/**"
      - "corpus/**"
      - "xtask/**"
      - "crates/einvoice-xdm/tests/oracle/**"
      - "crates/einvoice-xdm/examples/**"
      - "crates/einvoice-xpath-eval/tests/oracle/**"
      - "crates/einvoice-xpath-eval/examples/saxon-oracle.rs"
      - "crates/einvoice-xslt-exec/tests/probes/**"
      - "crates/einvoice-xslt-exec/tests/common/probes.rs"
      - "crates/einvoice-xslt-exec/examples/saxon-probes.rs"
      - "crates/einvoice-xsd/schemas/**"
      - "crates/einvoice-xsd/tests/oracle/**"
      - "crates/einvoice-xsd/examples/xmllint-oracle.rs"
      - "crates/einvoice-xml/src/**"
      - "crates/einvoice-xml/tests/common/**"
      - "crates/einvoice-xml/examples/saxon-check.rs"
      - "crates/einvoice-xml/tests/encoding/**"
      - "crates/einvoice-xml/examples/encoding-oracle.rs"
      - "crates/einvoice-validator/examples/encoding-oracle.rs"
      - "crates/einvoice-validator/tests/common/reencode.rs"
      - "crates/einvoice-svrl/**"
      - "scripts/check.sh"
      - "scripts/fetch-saxon.sh"
      - ".github/workflows/oracle.yml"
      - ".cargo/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "artefacts/**"
      - "corpus/**"
      - "xtask/**"
      - "crates/einvoice-xdm/tests/oracle/**"
      - "crates/einvoice-xdm/examples/**"
      - "crates/einvoice-xpath-eval/tests/oracle/**"
      - "crates/einvoice-xpath-eval/examples/saxon-oracle.rs"
      - "crates/einvoice-xslt-exec/tests/probes/**"
      - "crates/einvoice-xslt-exec/tests/common/probes.rs"
      - "crates/einvoice-xslt-exec/examples/saxon-probes.rs"
      - "crates/einvoice-xsd/schemas/**"
      - "crates/einvoice-xsd/tests/oracle/**"
      - "crates/einvoice-xsd/examples/xmllint-oracle.rs"
      - "crates/einvoice-xml/src/**"
      - "crates/einvoice-xml/tests/common/**"
      - "crates/einvoice-xml/examples/saxon-check.rs"
      - "crates/einvoice-xml/tests/encoding/**"
      - "crates/einvoice-xml/examples/encoding-oracle.rs"
      - "crates/einvoice-validator/examples/encoding-oracle.rs"
      - "crates/einvoice-validator/tests/common/reencode.rs"
      - "crates/einvoice-svrl/**"
      - "scripts/check.sh"
      - "scripts/fetch-saxon.sh"
      - ".github/workflows/oracle.yml"
      - ".cargo/**"
      - ".gitattributes"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same ref supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Transient download failures (HTTP 5xx, resets) are retried: cargo for the
  # crates, rustup for the toolchain (both default to 3 attempts).
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

defaults:
  run:
    shell: bash

jobs:
  oracle:
    name: oracle (Saxon-HE goldens, VEFA cross-check, xmllint)
    # Not ubuntu-latest: the xmllint results of einvoice-xsd were produced with
    # libxml2 2.9.14, the version Ubuntu 24.04 ships, and are re-run with the
    # same version. This runner is also the reference environment of the
    # encoding table of einvoice-xml (tests/encoding/expected.tsv, whose header
    # names it): libxml2 2.9.14 built with iconv and ICU, on Ubuntu 24.04, whose
    # tables decide the encoding names xmllint accepts, and Java 21 (below). Its
    # encoding-oracle example fails here in any other environment.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # xmllint (libxml2), the reference of einvoice-xsd.
      - name: Install xmllint
        run: |
          sudo apt-get -o Acquire::Retries=5 update -qq
          sudo apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends libxml2-utils
          xmllint --version 2>&1 | head -n 1
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: scripts/check.sh toolchain
      # The Saxon-HE jars, keyed by their pins. A cached jar is never trusted:
      # scripts/fetch-saxon.sh checks each one against its pinned SHA-256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/oracle/saxon
          key: saxon-${{ hashFiles('scripts/fetch-saxon.sh') }}
      # Fetches Saxon-HE from Maven Central (checksum verified) and fails,
      # rather than skips, if Java or xmllint is missing: CI=true on GitHub
      # runners.
      - name: oracle
        run: scripts/check.sh oracle
