[package]
name = "einvoice-xsd"
description = "XML Schema validation of UBL 2.1 Invoice and CreditNote documents against the official OASIS schemas, in pure Rust"
keywords = ["xsd", "ubl", "einvoice", "peppol", "en16931"]
categories = ["parser-implementations", "finance", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-xsd"
readme = "README.md"
# The code is MIT; the embedded OASIS UBL 2.1 schemas (schemas/oasis-ubl-2.1/) keep the
# terms stated in their own headers. Texts in LICENSES/, file by file in
# schemas/oasis-ubl-2.1/README.md.
license = "MIT AND LicenseRef-OASIS-Copyright-Notice AND LicenseRef-UN-CEFACT-Copyright-Notice AND W3C-19980720"

[dependencies]
roxmltree = "0.21.2"

[dev-dependencies]
peak_alloc = "0.3.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
sha2 = "0.11.1"

[lints]
workspace = true
