[package]
name = "einvoice-xsd"
description = "XML Schema validation of UBL 2.1 Invoice and CreditNote documents against the official OASIS schemas, in pure Rust"
keywords = ["xsd", "ubl", "einvoice", "peppol", "en16931"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
roxmltree = "0.21.2"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
sha2 = "0.11.1"

[lints]
workspace = true
