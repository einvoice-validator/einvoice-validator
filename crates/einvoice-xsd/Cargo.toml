[package]
name = "einvoice-xsd"
description = "XML Schema validation of UBL 2.1 and UN/CEFACT CII D16B e-invoices against the official OASIS and UN/CEFACT schemas, in pure Rust"
keywords = ["xsd", "ubl", "einvoice", "peppol", "en16931"]
categories = ["parser-implementations", "finance", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-xsd"
readme = "README.md"
# The code is MIT; the embedded OASIS UBL 2.1 schemas (schemas/oasis-ubl-2.1/) and
# UN/CEFACT CII D16B schemas (schemas/uncefact-cii-d16b/) keep the terms stated in their
# own headers. Texts in LICENSES/, file by file in the README.md of each directory.
license = "MIT AND LicenseRef-OASIS-Copyright-Notice AND LicenseRef-UN-CEFACT-Copyright-Notice AND W3C-19980720"

[dependencies]
einvoice-xml = { path = "../einvoice-xml", version = "0.3.0" }
roxmltree = "0.21.2"

[dev-dependencies]
einvoice-xml = { path = "../einvoice-xml" }
peak_alloc = "0.3.0"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
regex = "1.13.1"
sha2 = "0.11.1"

[lints]
workspace = true
