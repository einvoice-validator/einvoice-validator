[package]
name = "einvoice-cli"
description = "einvoice-validate: command-line validation of EN 16931 and Peppol BIS Billing 3.0 e-invoices against the official validation artefacts, in pure Rust"
keywords = ["peppol", "en16931", "einvoice", "ubl", "cli"]
categories = ["command-line-utilities", "finance"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-cli"
readme = "README.md"
# The code is MIT; the binary embeds the CEN EN 16931 stylesheets of einvoice-validator's
# built-in rule sets (default features), which are EUPL-1.2, and the OASIS UBL 2.1 and
# UN/CEFACT CII D16B schemas of einvoice-xsd, which keep the terms in their own headers
# (OASIS, UN/CEFACT, W3C). Texts in LICENSES/.
license = "MIT AND EUPL-1.2 AND LicenseRef-OASIS-Copyright-Notice AND LicenseRef-UN-CEFACT-Copyright-Notice AND W3C-19980720"

[[bin]]
name = "einvoice-validate"
path = "src/main.rs"

[features]
default = ["fetch"]
# `rules fetch` and `--fetch`: downloads the rule sets that are not redistributed from
# their publishers (einvoice-validator's feature `fetch`). Without it, the cache is
# still read.
fetch = ["einvoice-validator/fetch"]

[dependencies]
einvoice-validator = { path = "../einvoice-validator", version = "0.2.0", features = ["pdf"] }

[dev-dependencies]
einvoice-svrl = { path = "../einvoice-svrl", version = "0.2.0" }
# Not published: without a version, cargo leaves it out of the published manifest.
einvoice-testkit = { path = "../einvoice-testkit" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sha2 = "0.11.1"

[lints]
workspace = true
