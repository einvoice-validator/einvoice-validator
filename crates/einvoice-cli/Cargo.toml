[package]
name = "einvoice-cli"
description = "einvoice-validate: command-line validation of EN 16931 and Peppol BIS Billing 3.0 e-invoices against the official validation artefacts, in pure Rust"
keywords = ["peppol", "en16931", "einvoice", "ubl", "cli"]
categories = ["command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-cli"
# The code is MIT; built with the default features, the binary embeds the CEN EN 16931
# stylesheet of einvoice-validator's built-in rule set, which is EUPL-1.2. Texts in
# LICENSES/.
license = "MIT AND EUPL-1.2"

[[bin]]
name = "einvoice-validate"
path = "src/main.rs"

[dependencies]
einvoice-validator = { path = "../einvoice-validator", version = "0.0.0" }

[dev-dependencies]
einvoice-svrl = { path = "../einvoice-svrl", version = "0.0.0" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sha2 = "0.11.1"

[lints]
workspace = true
