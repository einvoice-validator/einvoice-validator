[package]
name = "einvoice-xpath-eval"
description = "Node model and evaluator of the XPath 2.0 subset used by the official e-invoicing validation stylesheets, with the behaviour of Saxon-HE 12.10"
keywords = ["xpath", "xslt", "schematron", "einvoice", "peppol"]
categories = ["text-processing", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-xpath-eval"
readme = "README.md"
license.workspace = true

[dependencies]
einvoice-xdm = { path = "../einvoice-xdm", version = "0.2.0" }
einvoice-xpath = { path = "../einvoice-xpath", version = "0.2.0" }
roxmltree = "0.21.2"

[dev-dependencies]
peak_alloc = "0.3.0"
sha2 = "0.11.1"

# Its random source (getrandom) does not build for wasm32-unknown-unknown, where the
# examples must build (examples/wasm-smoke.rs).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
