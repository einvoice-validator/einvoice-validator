[package]
name = "einvoice-xdm"
description = "Atomic values of the XPath 2.0 data model (exact xs:decimal, xs:integer, xs:double, casts, comparisons, XSD regular expressions) with the behaviour of Saxon-HE 12.10"
keywords = ["xpath", "xsd", "decimal", "einvoice", "peppol"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-xdm"
license.workspace = true

[dependencies]
num-bigint = "0.4.8"
num-integer = "0.1.47"
num-traits = "0.2.19"
regex = "1.13.1"

[dev-dependencies]
num-rational = "0.4.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
roxmltree = "0.21.2"
sha2 = "0.11.1"

[lints]
workspace = true
