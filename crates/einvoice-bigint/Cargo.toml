[package]
name = "einvoice-bigint"
description = "Arbitrary-precision signed integers in safe Rust, without dependencies and without assembly: exact arithmetic, truncated and floored division, decimal strings, conversions to and from f64"
keywords = ["bigint", "arbitrary-precision", "integer", "no-asm", "einvoice"]
categories = ["mathematics", "algorithms", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-bigint"
readme = "README.md"
license.workspace = true

[dependencies]

# num-bigint is the reference the tests and the benchmark compare with; it is not a
# dependency of the library.
[dev-dependencies]
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
