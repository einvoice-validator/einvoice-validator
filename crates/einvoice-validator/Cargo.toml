[package]
name = "einvoice-validator"
description = "Validate EN 16931 and Peppol BIS Billing 3.0 e-invoices against the official validation artefacts, in pure Rust"
keywords = ["peppol", "en16931", "ubl", "cii", "schematron"]
categories = ["finance", "parser-implementations", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-validator"
readme = "README.md"
# The code is MIT; the CEN EN 16931 stylesheets vendored in bundles/cen-ubl/ and
# bundles/cen-cii/ and embedded by the default features `cen-ubl` and `cen-cii` are
# EUPL-1.2 (the README of each bundle); every build embeds the OASIS UBL 2.1 and
# UN/CEFACT CII D16B schemas of einvoice-xsd, which keep the terms in their own headers
# (OASIS, UN/CEFACT, W3C). Texts in LICENSES/.
license = "MIT AND EUPL-1.2 AND LicenseRef-OASIS-Copyright-Notice AND LicenseRef-UN-CEFACT-Copyright-Notice AND W3C-19980720"

[features]
default = ["cen-ubl", "cen-cii", "pdf"]
# Embeds the official CEN EN 16931 UBL 1.3.17 stylesheet (EUPL-1.2, about 900 kB) and
# provides the built-in rule set `cen-ubl`.
cen-ubl = []
# Embeds the official CEN EN 16931 CII 1.3.17 stylesheet (EUPL-1.2, about 730 kB) and
# provides the built-in rule set `cen-cii`.
cen-cii = []
# The module `pdf`: the invoice XML embedded in a Factur-X, ZUGFeRD or Order-X PDF file,
# with einvoice-pdf (pure Rust; adds miniz_oxide for Flate).
pdf = ["dep:einvoice-pdf"]
# RuleSetCache::fetch: downloads the rule sets that are not redistributed (Factur-X,
# XRechnung, the French rules, Peppol BIS Billing 3.0) from their publishers, at pinned
# URLs, checked against pinned digests, and assembles their bundles in the cache. A
# minimal HTTPS client on rustls, with a cryptography provider on the RustCrypto crates
# (src/rulesets/fetch/tls.rs: AES-GCM, ChaCha20-Poly1305, ECDHE and ECDSA on P-256 and
# P-384, RSA signature verification, SHA-2, HMAC; pure Rust) and the Mozilla roots of
# webpki-roots, and ZIP, gzip and tar readers on miniz_oxide; the Peppol Schematron
# compiled as ph-schematron compiles it, in Rust (einvoice-schematron, with the ISO
# Schematron skeleton it downloads). Ignored on WebAssembly.
fetch = [
    "dep:einvoice-schematron",
    "dep:miniz_oxide",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:aes-gcm",
    "dep:chacha20poly1305",
    "dep:ecdsa",
    "dep:getrandom",
    "dep:hmac",
    "dep:p256",
    "dep:p384",
    "dep:rsa",
]

[dependencies]
einvoice-pdf = { path = "../einvoice-pdf", version = "0.3.0", optional = true }
einvoice-svrl = { path = "../einvoice-svrl", version = "0.3.0" }
einvoice-xml = { path = "../einvoice-xml", version = "0.3.0" }
einvoice-xpath = { path = "../einvoice-xpath", version = "0.3.0" }
einvoice-xpath-eval = { path = "../einvoice-xpath-eval", version = "0.3.0" }
einvoice-xsd = { path = "../einvoice-xsd", version = "0.3.0" }
einvoice-xslt = { path = "../einvoice-xslt", version = "0.3.0" }
einvoice-xslt-exec = { path = "../einvoice-xslt-exec", version = "0.3.0" }
sha2 = "0.11.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Compiles the Peppol Schematron (feature `fetch`), as ph-schematron does.
einvoice-schematron = { path = "../einvoice-schematron", version = "0.3.0", optional = true }
miniz_oxide = { version = "0.9.1", optional = true }
# The TLS client of the feature `fetch`: rustls without a built-in cryptography provider
# (`custom-provider`: neither ring nor aws-lc-rs, both C and assembly), and the
# RustCrypto crates of the provider of src/rulesets/fetch/tls.rs, without their default
# features.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes"], optional = true }
chacha20poly1305 = { version = "0.11.0", default-features = false, optional = true }
# Only for its DER signatures (`der`); p256 and p384 bring it anyway.
ecdsa = { version = "0.17.0", default-features = false, features = ["der"], optional = true }
getrandom = { version = "0.4.3", default-features = false, optional = true }
hmac = { version = "0.13.0", default-features = false, optional = true }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa"], optional = true }
p384 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa"], optional = true }
# The 0.10 series is the one built on the same RustCrypto releases as the crates above
# (digest 0.11, crypto-bigint 0.7); 0.9 would duplicate them. Signature verification with
# public keys only.
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15", "std"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["custom-provider", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }

[dev-dependencies]
# Not published: without a version, cargo leaves it out of the published manifest.
einvoice-testkit = { path = "../einvoice-testkit" }
peak_alloc = "0.3.0"
roxmltree = "0.21.2"

# Its random source (getrandom) does not build for wasm32-unknown-unknown, where the
# examples must build (examples/wasm-validate.rs).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[example]]
name = "bench"
required-features = ["cen-ubl"]

[[example]]
name = "footprint"
required-features = ["cen-ubl"]

[[example]]
name = "heap"
required-features = ["cen-ubl"]

[[example]]
name = "wasm-validate"
required-features = ["cen-ubl"]

[[test]]
name = "rulesets"
required-features = ["fetch"]

[lints]
workspace = true
