[package]
name = "einvoice-validator"
description = "Validate EN 16931 and Peppol BIS Billing 3.0 e-invoices against the official validation artefacts, in pure Rust"
keywords = ["peppol", "en16931", "ubl", "cii", "schematron"]
categories = ["finance", "parser-implementations", "wasm"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/einvoice-validator"
readme = "README.md"
# The code is MIT; the CEN EN 16931 stylesheets vendored in bundles/cen-ubl/ and
# bundles/cen-cii/ and embedded by the default features `cen-ubl` and `cen-cii` are
# EUPL-1.2 (the README of each bundle); every build embeds the OASIS UBL 2.1 schemas of
# einvoice-xsd, which keep the terms in their own headers (OASIS, UN/CEFACT, W3C). Texts
# in LICENSES/.
license = "MIT AND EUPL-1.2 AND LicenseRef-OASIS-Copyright-Notice AND LicenseRef-UN-CEFACT-Copyright-Notice AND W3C-19980720"

[features]
default = ["cen-ubl", "cen-cii", "pdf"]
# Embeds the official CEN EN 16931 UBL 1.3.17 stylesheet (EUPL-1.2, about 900 kB) and
# provides the built-in rule set `cen-ubl`.
cen-ubl = []
# Embeds the official CEN EN 16931 CII 1.3.17 stylesheet (EUPL-1.2, about 730 kB) and
# provides the built-in rule set `cen-cii`.
cen-cii = []
# The module `pdf`: the invoice XML embedded in a Factur-X, ZUGFeRD or Order-X PDF file,
# with einvoice-pdf (pure Rust; adds miniz_oxide for Flate).
pdf = ["dep:einvoice-pdf"]

[dependencies]
einvoice-pdf = { path = "../einvoice-pdf", version = "0.2.0", optional = true }
einvoice-svrl = { path = "../einvoice-svrl", version = "0.2.0" }
einvoice-xpath-eval = { path = "../einvoice-xpath-eval", version = "0.2.0" }
einvoice-xsd = { path = "../einvoice-xsd", version = "0.2.0" }
einvoice-xslt = { path = "../einvoice-xslt", version = "0.2.0" }
einvoice-xslt-exec = { path = "../einvoice-xslt-exec", version = "0.2.0" }
roxmltree = "0.21.2"
sha2 = "0.11.1"

[dev-dependencies]
# Not published: without a version, cargo leaves it out of the published manifest.
einvoice-testkit = { path = "../einvoice-testkit" }
peak_alloc = "0.3.0"

# Its random source (getrandom) does not build for wasm32-unknown-unknown, where the
# examples must build (examples/wasm-validate.rs).
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[example]]
name = "bench"
required-features = ["cen-ubl"]

[[example]]
name = "heap"
required-features = ["cen-ubl"]

[[example]]
name = "wasm-validate"
required-features = ["cen-ubl"]

[lints]
workspace = true
