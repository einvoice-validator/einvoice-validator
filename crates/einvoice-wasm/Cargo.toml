[package]
name = "einvoice-wasm"
description = "JavaScript and TypeScript bindings of einvoice-validator (WebAssembly), the source of the npm package einvoice-validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license = "MIT AND EUPL-1.2 AND LicenseRef-OASIS-Copyright-Notice AND LicenseRef-UN-CEFACT-Copyright-Notice AND W3C-19980720"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cen-ubl", "cen-cii"]
# The built-in rule sets of einvoice-validator: the CEN EN 16931 stylesheets for UBL
# (about 900 kB) and for CII (about 730 kB), EUPL-1.2.
cen-ubl = ["einvoice-validator/cen-ubl"]
cen-cii = ["einvoice-validator/cen-cii"]

[dependencies]
einvoice-validator = { path = "../einvoice-validator", version = "0.4.0", default-features = false }
js-sys = { version = "0.3.107", default-features = false }
wasm-bindgen = "0.2.130"

[dev-dependencies]
einvoice-testkit = { path = "../einvoice-testkit" }

# Its random source (getrandom) does not build for wasm32-unknown-unknown; the tests that
# use it run natively.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
