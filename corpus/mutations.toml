# Mutation catalogue: each [[mutation]] derives one test document from a base document of a
# rule set, by a list of edits. `cargo xtask corpus --write` applies it to the bases of each
# rule set (see xtask/src/mutation.rs for the edits and the path syntax, xtask/src/ruleset.rs
# for the bases); the reference engine's results are the goldens of the rule set.
#
# Keys: id (also the file name), base (invoice, credit-note or allowances), reason (one line:
# what the mutation exercises, with the rules it targets), edits, and optionally only (the
# rule sets it applies to). Rule ids in reasons name the rules aimed at: the goldens record
# what actually fires.
#
# Paths in the edits below:
#   LMT  /*/cac:LegalMonetaryTotal
#   SUP  /*/cac:AccountingSupplierParty/cac:Party      CUS  ... AccountingCustomerParty
#   L1   /*/cac:InvoiceLine[1] (CreditNoteLine in credit notes)

# ---------------------------------------------------------------------------------------
# Document totals: sums one cent off, in each direction

[[mutation]]
id = "totals/line-extension-plus-cent"
base = "invoice"
reason = "Sum of line net amounts (BT-106) one cent above the lines (BR-CO-10)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "0.01"]]

[[mutation]]
id = "totals/line-extension-minus-cent"
base = "invoice"
reason = "Sum of line net amounts (BT-106) one cent below the lines (BR-CO-10)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "-0.01"]]

[[mutation]]
id = "totals/tax-exclusive-plus-cent"
base = "invoice"
reason = "Total without VAT (BT-109) one cent above lines plus charges minus allowances (BR-CO-13)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:TaxExclusiveAmount', "0.01"]]

[[mutation]]
id = "totals/tax-inclusive-plus-cent"
base = "invoice"
reason = "Total with VAT (BT-112) one cent above total without VAT plus VAT (BR-CO-15)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount', "0.01"]]

[[mutation]]
id = "totals/tax-inclusive-minus-cent"
base = "invoice"
reason = "Total with VAT (BT-112) one cent below total without VAT plus VAT (BR-CO-15)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount', "-0.01"]]

[[mutation]]
id = "totals/payable-plus-cent"
base = "invoice"
reason = "Amount due (BT-115) one cent above total with VAT minus prepaid plus rounding (BR-CO-16)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.01"]]

[[mutation]]
id = "totals/payable-minus-cent"
base = "invoice"
reason = "Amount due (BT-115) one cent below the computed amount (BR-CO-16)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "-0.01"]]

[[mutation]]
id = "totals/charge-total-plus-cent"
base = "invoice"
reason = "Sum of document charges (BT-108) one cent above the charges (BR-CO-12)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:ChargeTotalAmount', "0.01"]]

[[mutation]]
id = "totals/allowance-total-plus-cent"
base = "allowances"
reason = "Sum of document allowances (BT-107) one cent above the allowances (BR-CO-11)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:AllowanceTotalAmount', "0.01"]]

[[mutation]]
id = "totals/prepaid-plus-cent"
base = "allowances"
reason = "Paid amount (BT-113) one cent higher, amount due unchanged (BR-CO-16)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount', "0.01"]]

[[mutation]]
id = "totals/rounding-amount-added"
base = "allowances"
reason = "Rounding amount (BT-114) of one cent not reflected in the amount due (BR-CO-16)"
edits = [
  ["duplicate", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount'],
  ["rename", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount[2]', "cbc:PayableRoundingAmount"],
  ["set", '/*/cac:LegalMonetaryTotal/cbc:PayableRoundingAmount', "0.01"],
]

[[mutation]]
id = "totals/rounding-amount-consistent"
base = "allowances"
reason = "Rounding amount (BT-114) of minus one cent and amount due lowered to match (BR-CO-16 holds)"
edits = [
  ["duplicate", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount'],
  ["rename", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount[2]', "cbc:PayableRoundingAmount"],
  ["set", '/*/cac:LegalMonetaryTotal/cbc:PayableRoundingAmount', "-0.01"],
  ["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "-0.01"],
]

[[mutation]]
id = "totals/prepaid-without-due-change"
base = "invoice"
reason = "Paid amount (BT-113) added without lowering the amount due (BR-CO-16)"
edits = [
  ["remove-all", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount'],
  ["duplicate", '/*/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount'],
  ["rename", '/*/cac:LegalMonetaryTotal/cbc:TaxInclusiveAmount[2]', "cbc:PrepaidAmount"],
  ["set", '/*/cac:LegalMonetaryTotal/cbc:PrepaidAmount', "100.00"],
]

[[mutation]]
id = "totals/tax-total-plus-cent"
base = "invoice"
reason = "Invoice total VAT amount (BT-110) one cent above the sum of the VAT category amounts (BR-CO-14)"
edits = [["add", '/*/cac:TaxTotal[1]/cbc:TaxAmount', "0.01"]]

[[mutation]]
id = "totals/tax-subtotal-amount-plus-cent"
base = "invoice"
reason = "VAT category tax amount (BT-117) one cent high: BR-CO-14 fires, BR-S-09 tolerates it"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxAmount', "0.01"]]

[[mutation]]
id = "totals/taxable-amount-plus-cent"
base = "invoice"
reason = "VAT category taxable amount (BT-116) one cent above its lines: inside the tolerance of 1 of BR-S-08"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxableAmount', "0.01"]]

[[mutation]]
id = "totals/taxable-amount-plus-one"
base = "invoice"
reason = "VAT category taxable amount exactly 1 above its lines: on the bound of the tolerance of BR-S-08"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxableAmount', "1"]]

[[mutation]]
id = "totals/taxable-amount-minus-just-under-one"
base = "invoice"
reason = "VAT category taxable amount 0.99 below its lines: inside the tolerance of 1 of BR-S-08"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxableAmount', "-0.99"]]

[[mutation]]
id = "totals/taxable-amount-minus-one-cent-over"
base = "invoice"
reason = "VAT category taxable amount 1.01 below its lines: outside the tolerance of BR-S-08"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxableAmount', "-1.01"]]

[[mutation]]
id = "totals/line-amount-plus-cent"
base = "invoice"
reason = "First line net amount (BT-131) one cent higher: document sums and VAT breakdown no longer match"
edits = [["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "0.01"]]

[[mutation]]
id = "totals/lines-compensating-cents"
base = "invoice"
reason = "One line a cent higher, another a cent lower: sums hold, line amount against quantity times price does not"
edits = [
  ["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "0.01"],
  ["add", '/*/cac:InvoiceLine[2]/cbc:LineExtensionAmount', "-0.01"],
]

[[mutation]]
id = "totals/allowance-plus-cent-totals-unchanged"
base = "allowances"
reason = "Document allowance one cent higher while every total stays (BR-CO-11)"
edits = [["add", '/*/cac:AllowanceCharge[cbc:ChargeIndicator!="true"]/cbc:Amount', "0.01"]]

[[mutation]]
id = "totals/charge-plus-cent-totals-unchanged"
base = "allowances"
reason = "Document charge one cent higher while every total stays (BR-CO-12)"
edits = [["add", '/*/cac:AllowanceCharge[cbc:ChargeIndicator="true"]/cbc:Amount', "0.01"]]

[[mutation]]
id = "totals/credit-note-payable-plus-cent"
base = "credit-note"
reason = "Credit note amount due one cent above the computed amount (BR-CO-16 in a credit note)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.01"]]

[[mutation]]
id = "totals/credit-note-line-amount-plus-cent"
base = "credit-note"
reason = "Credit note line amount one cent higher (BR-CO-10 over cac:CreditNoteLine)"
edits = [["add", '/*/cac:CreditNoteLine[1]/cbc:LineExtensionAmount', "0.01"]]

[[mutation]]
id = "totals/credit-note-taxable-minus-cent"
base = "credit-note"
reason = "Credit note VAT category taxable amount one cent low: inside the tolerance of 1 of BR-S-08"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxableAmount', "-0.01"]]

[[mutation]]
id = "totals/all-amounts-negated"
base = "invoice"
reason = "Every amount and quantity negated consistently: a negative invoice whose sums still hold"
edits = [
  ["multiply", '//cbc:LineExtensionAmount', "-1"],
  ["multiply", '//cbc:TaxExclusiveAmount', "-1"],
  ["multiply", '//cbc:TaxInclusiveAmount', "-1"],
  ["multiply", '//cbc:PayableAmount', "-1"],
  ["multiply", '//cbc:ChargeTotalAmount', "-1"],
  ["multiply", '//cbc:TaxableAmount', "-1"],
  ["multiply", '//cbc:TaxAmount', "-1"],
  ["multiply", '//cbc:Amount', "-1"],
  ["multiply", '//cbc:InvoicedQuantity', "-1"],
]

[[mutation]]
id = "totals/payable-negated"
base = "invoice"
reason = "Only the amount due negated (BR-CO-16 with a negative amount due)"
edits = [["multiply", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "-1"]]

# ---------------------------------------------------------------------------------------
# Rounding: XPath round() rounds halves towards positive infinity

[[mutation]]
id = "rounding/line-half-cent-up"
base = "invoice"
reason = "A line amount with a third decimal 5 above: the sum rounds up and no longer matches BT-106 (BR-DEC-23, BR-CO-10)"
edits = [["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "0.005"]]

[[mutation]]
id = "rounding/line-half-cent-down"
base = "invoice"
reason = "A line amount with a third decimal 5 below: the sum rounds up back to BT-106 (BR-DEC-23 only)"
edits = [["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "-0.005"]]

[[mutation]]
id = "rounding/negative-sum-half-cent-down"
base = "invoice"
reason = "Negated lines and total, one line half a cent lower: round() of a negative half goes towards zero (BR-CO-10 holds)"
edits = [
  ["multiply", '/*/cac:InvoiceLine/cbc:LineExtensionAmount', "-1"],
  ["multiply", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "-1"],
  ["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "-0.005"],
]

[[mutation]]
id = "rounding/negative-sum-half-cent-up"
base = "invoice"
reason = "Negated lines and total, one line half a cent higher: the negative sum rounds up away from BT-106 (BR-CO-10)"
edits = [
  ["multiply", '/*/cac:InvoiceLine/cbc:LineExtensionAmount', "-1"],
  ["multiply", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "-1"],
  ["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "0.005"],
]

[[mutation]]
id = "rounding/tax-amount-half-cent"
base = "invoice"
reason = "VAT category tax amount with a third decimal 5 (BR-DEC-20, BR-CO-14; inside the tolerance of BR-S-09)"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxAmount', "0.005"]]

[[mutation]]
id = "rounding/taxable-half-cent"
base = "invoice"
reason = "VAT category taxable amount with a third decimal 5 (BR-DEC-19; inside the tolerance of BR-S-08)"
edits = [["add", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxableAmount', "0.005"]]

[[mutation]]
id = "rounding/payable-three-decimals"
base = "invoice"
reason = "Amount due with three decimals (BR-DEC-18, BR-CO-16 exact comparison)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.001"]]

[[mutation]]
id = "rounding/tax-total-three-decimals"
base = "invoice"
reason = "Invoice total VAT amount with three decimals (UBL-DT-01, BR-CO-14)"
edits = [["add", '/*/cac:TaxTotal[1]/cbc:TaxAmount', "0.001"]]

[[mutation]]
id = "rounding/credit-note-line-half-cent"
base = "credit-note"
reason = "Credit note line amount with a third decimal 5 (BR-DEC-23 and BR-CO-10 over credit note lines)"
edits = [["add", '/*/cac:CreditNoteLine[1]/cbc:LineExtensionAmount', "0.005"]]

# ---------------------------------------------------------------------------------------
# Decimals: scale, precision and size of xs:decimal values

[[mutation]]
id = "decimals/amounts-four-decimals"
base = "invoice"
reason = "Every amount written with four decimals, values unchanged: decimal rules fire, sums still equal (BR-DEC-*)"
edits = [
  ["add", '//cbc:LineExtensionAmount', "0.0000"],
  ["add", '//cbc:TaxExclusiveAmount', "0.0000"],
  ["add", '//cbc:TaxInclusiveAmount', "0.0000"],
  ["add", '//cbc:PayableAmount', "0.0000"],
  ["add", '//cbc:ChargeTotalAmount', "0.0000"],
  ["add", '//cbc:TaxableAmount', "0.0000"],
  ["add", '//cbc:TaxAmount', "0.0000"],
  ["add", '//cbc:Amount', "0.0000"],
  ["add", '//cbc:PriceAmount', "0.0000"],
]

[[mutation]]
id = "decimals/allowance-amounts-three-decimals"
base = "allowances"
reason = "Every allowance and charge amount and base amount with three decimals, values unchanged (BR-DEC-01..28 on allowances and charges)"
edits = [
  ["add", '//cbc:Amount', "0.000"],
  ["add", '//cbc:BaseAmount', "0.000"],
]

[[mutation]]
id = "decimals/doc-allowance-base-amount-three-decimals"
base = "allowances"
reason = "Document allowance base amount with three decimals (BR-DEC-02)"
edits = [
  ["remove-all", '/*/cac:AllowanceCharge[cbc:ChargeIndicator!="true"]/cbc:BaseAmount'],
  ["duplicate", '/*/cac:AllowanceCharge[cbc:ChargeIndicator!="true"]/cbc:Amount'],
  ["rename", '/*/cac:AllowanceCharge[cbc:ChargeIndicator!="true"]/cbc:Amount[2]', "cbc:BaseAmount"],
  ["set", '/*/cac:AllowanceCharge[cbc:ChargeIndicator!="true"]/cbc:BaseAmount', "1000.125"],
]

[[mutation]]
id = "decimals/line-charge-amount-three-decimals"
base = "allowances"
reason = "Line charge amount with three decimals (BR-DEC-27)"
edits = [["add", '/*/cac:InvoiceLine[1]/cac:AllowanceCharge[cbc:ChargeIndicator="true"]/cbc:Amount', "0.001"]]

[[mutation]]
id = "decimals/line-allowance-amount-three-decimals"
base = "allowances"
reason = "Line allowance amount with three decimals (BR-DEC-24)"
edits = [["add", '/*/cac:InvoiceLine[1]/cac:AllowanceCharge[cbc:ChargeIndicator="false"]/cbc:Amount', "0.001"]]

[[mutation]]
id = "decimals/payable-tiny-fraction"
base = "invoice"
reason = "Amount due 10^-10 above the computed amount: exact decimal comparison (BR-DEC-18, BR-CO-16)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.0000000001"]]

[[mutation]]
id = "decimals/payable-31-decimals"
base = "invoice"
reason = "Amount due 10^-31 above the computed amount: beyond 28 significant digits (BR-DEC-18, BR-CO-16)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.0000000000000000000000000000001"]]

[[mutation]]
id = "decimals/line-and-total-25-decimals"
base = "invoice"
reason = "A line and the sum of lines both 10^-25 higher: the sum matches exactly in decimal arithmetic"
edits = [
  ["add", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "0.0000000000000000000000001"],
  ["add", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "0.0000000000000000000000001"],
]

[[mutation]]
id = "decimals/payable-trailing-zero-scale"
base = "invoice"
reason = "Amount due with a third decimal 0: equal value, longer scale (BR-DEC-18 only)"
edits = [["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.000"]]

[[mutation]]
id = "decimals/amounts-times-1e9"
base = "invoice"
reason = "Every amount and price times 10^9, consistently: sums still hold at the scale of 10^13"
edits = [
  ["multiply", '//cbc:LineExtensionAmount', "1000000000"],
  ["multiply", '//cbc:TaxExclusiveAmount', "1000000000"],
  ["multiply", '//cbc:TaxInclusiveAmount', "1000000000"],
  ["multiply", '//cbc:PayableAmount', "1000000000"],
  ["multiply", '//cbc:ChargeTotalAmount', "1000000000"],
  ["multiply", '//cbc:TaxableAmount', "1000000000"],
  ["multiply", '//cbc:TaxAmount', "1000000000"],
  ["multiply", '//cbc:Amount', "1000000000"],
  ["multiply", '//cbc:PriceAmount', "1000000000"],
]

[[mutation]]
id = "decimals/amounts-times-1e15"
base = "invoice"
reason = "Every amount and price times 10^15: values beyond 2^53, exact only in decimal arithmetic"
edits = [
  ["multiply", '//cbc:LineExtensionAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxExclusiveAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxInclusiveAmount', "1000000000000000"],
  ["multiply", '//cbc:PayableAmount', "1000000000000000"],
  ["multiply", '//cbc:ChargeTotalAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxableAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxAmount', "1000000000000000"],
  ["multiply", '//cbc:Amount', "1000000000000000"],
  ["multiply", '//cbc:PriceAmount', "1000000000000000"],
]

[[mutation]]
id = "decimals/payable-plus-cent-at-1e15"
base = "invoice"
reason = "Amounts times 10^15 and the amount due one cent off: a difference doubles cannot see (BR-CO-16)"
edits = [
  ["multiply", '//cbc:LineExtensionAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxExclusiveAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxInclusiveAmount', "1000000000000000"],
  ["multiply", '//cbc:PayableAmount', "1000000000000000"],
  ["multiply", '//cbc:ChargeTotalAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxableAmount', "1000000000000000"],
  ["multiply", '//cbc:TaxAmount', "1000000000000000"],
  ["multiply", '//cbc:Amount', "1000000000000000"],
  ["multiply", '//cbc:PriceAmount', "1000000000000000"],
  ["add", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0.01"],
]

[[mutation]]
id = "decimals/quantity-huge"
base = "invoice"
reason = "Invoiced quantity times 10^20: quantity times price far beyond 64-bit integers"
edits = [["multiply", '/*/cac:InvoiceLine[1]/cbc:InvoicedQuantity', "100000000000000000000"]]

[[mutation]]
id = "decimals/quantity-many-decimals"
base = "allowances"
reason = "Invoiced quantity with twelve decimals (quantity times price no longer the line amount)"
edits = [["add", '/*/cac:InvoiceLine[1]/cbc:InvoicedQuantity', "0.000000000001"]]

[[mutation]]
id = "decimals/payable-thousand-zeros"
base = "allowances"
reason = "Amount due written with 1000 more trailing zeros: same value, scale over 1000 (BR-DEC-18, BR-CO-16 holds)"
edits = [["suffix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0", "1000"]]

# ---------------------------------------------------------------------------------------
# Lexical forms of numbers and booleans: what xs:decimal, xs:boolean and number() accept

[[mutation]]
id = "format/payable-exponent"
base = "invoice"
reason = "Amount due in exponent notation, which xs:decimal does not accept (FORG0001)"
edits = [["set", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "1.5E3"]]

[[mutation]]
id = "format/line-amount-exponent"
base = "invoice"
reason = "A line amount in exponent notation: its cast to xs:decimal raises FORG0001"
edits = [["set", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', "2.8E3"]]

[[mutation]]
id = "format/price-exponent"
base = "allowances"
reason = "Item net price in exponent notation: a number for the CEN rules (BR-27), a failed xs:decimal cast in the Peppol rules"
edits = [["set", '/*/cac:InvoiceLine[1]/cac:Price/cbc:PriceAmount', "4.1E2"]]

[[mutation]]
id = "format/quantity-exponent"
base = "invoice"
reason = "Invoiced quantity in exponent notation"
edits = [["set", '/*/cac:InvoiceLine[1]/cbc:InvoicedQuantity', "1E1"]]

[[mutation]]
id = "format/percent-exponent"
base = "invoice"
reason = "VAT rate of a line in exponent notation (2.5E1)"
edits = [["set", '/*/cac:InvoiceLine[1]/cac:Item/cac:ClassifiedTaxCategory/cbc:Percent', "2.5E1"]]

[[mutation]]
id = "format/payable-leading-plus"
base = "invoice"
reason = "Amount due with a leading plus sign, valid for xs:decimal"
edits = [["prefix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "+"]]

[[mutation]]
id = "format/payable-leading-zeros"
base = "invoice"
reason = "Amount due with leading zeros, same value"
edits = [["prefix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "000"]]

[[mutation]]
id = "format/line-total-trailing-point"
base = "invoice"
reason = "Sum of line net amounts ending with a decimal point (valid xs:decimal when it has no fraction)"
edits = [["suffix", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "."]]

[[mutation]]
id = "format/payable-padded-spaces"
base = "invoice"
reason = "Amount due surrounded by spaces: xs:decimal trims them, substring-after does not (BR-DEC-18)"
edits = [
  ["prefix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "  "],
  ["suffix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "  "],
]

[[mutation]]
id = "format/payable-padded-newlines"
base = "invoice"
reason = "Amount due surrounded by line feeds and tabs"
edits = [
  ["prefix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "\n\t"],
  ["suffix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "\n"],
]

[[mutation]]
id = "format/line-amount-trailing-space"
base = "invoice"
reason = "A line amount with a trailing space: the decimal count of BR-DEC-23 runs on the whitespace-collapsed value"
edits = [["suffix", '/*/cac:InvoiceLine[1]/cbc:LineExtensionAmount', " "]]

[[mutation]]
id = "format/payable-no-break-space"
base = "invoice"
reason = "Amount due followed by a no-break space, which is not XML whitespace (cast error)"
edits = [["suffix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', " "]]

[[mutation]]
id = "format/payable-empty"
base = "invoice"
reason = "Amount due empty (cast of an empty string to xs:decimal)"
edits = [["set", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', ""]]

[[mutation]]
id = "format/payable-whitespace-only"
base = "invoice"
reason = "Amount due made of spaces only"
edits = [["set", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "   "]]

[[mutation]]
id = "format/tax-amount-empty"
base = "invoice"
reason = "VAT category tax amount empty: its cast to xs:decimal raises FORG0001"
edits = [["set", '/*/cac:TaxTotal[1]/cac:TaxSubtotal[1]/cbc:TaxAmount', ""]]

[[mutation]]
id = "format/charge-total-empty"
base = "invoice"
reason = "Sum of charges empty: its cast to xs:decimal raises FORG0001"
edits = [["set", '/*/cac:LegalMonetaryTotal/cbc:ChargeTotalAmount', ""]]

[[mutation]]
id = "format/price-empty"
base = "invoice"
