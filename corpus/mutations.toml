# ---------------------------------------------------------------------------------------
# Credit notes

[[mutation]]
id = "credit-notes/type-code-unknown"
base = "credit-note"
reason = "Credit note type code 999 (BR-CL-01)"
edits = [["set", '/*/cbc:CreditNoteTypeCode', "999"]]

[[mutation]]
id = "credit-notes/type-code-invoice"
base = "credit-note"
reason = "Credit note type code 380 (an invoice code) in a credit note"
edits = [["set", '/*/cbc:CreditNoteTypeCode', "380"]]

[[mutation]]
id = "credit-notes/type-code-padded"
base = "credit-note"
reason = "Credit note type code with surrounding whitespace"
edits = [
  ["prefix", '/*/cbc:CreditNoteTypeCode', "\t"],
  ["suffix", '/*/cbc:CreditNoteTypeCode', " "],
]

[[mutation]]
id = "credit-notes/invoice-type-code-element"
base = "credit-note"
reason = "Credit note carrying cbc:InvoiceTypeCode instead of cbc:CreditNoteTypeCode"
edits = [["rename", '/*/cbc:CreditNoteTypeCode', "cbc:InvoiceTypeCode"]]

[[mutation]]
id = "credit-notes/invoice-line-element"
base = "credit-note"
reason = "Credit note whose first line is a cac:InvoiceLine with an invoiced quantity"
edits = [
  ["rename", '/*/cac:CreditNoteLine[1]/cbc:CreditedQuantity', "cbc:InvoicedQuantity"],
  ["rename", '/*/cac:CreditNoteLine[1]', "cac:InvoiceLine"],
]

[[mutation]]
id = "credit-notes/credit-note-line-in-invoice"
base = "invoice"
reason = "Invoice whose first line is a cac:CreditNoteLine with a credited quantity"
edits = [
  ["rename", '/*/cac:InvoiceLine[1]/cbc:InvoicedQuantity', "cbc:CreditedQuantity"],
  ["rename", '/*/cac:InvoiceLine[1]', "cac:CreditNoteLine"],
]

[[mutation]]
id = "credit-notes/all-negated"
base = "credit-note"
reason = "Every amount and credited quantity of a credit note negated consistently"
edits = [
  ["multiply", '//cbc:LineExtensionAmount', "-1"],
  ["multiply", '//cbc:TaxExclusiveAmount', "-1"],
  ["multiply", '//cbc:TaxInclusiveAmount', "-1"],
  ["multiply", '//cbc:PayableAmount', "-1"],
  ["multiply", '//cbc:TaxableAmount', "-1"],
  ["multiply", '//cbc:TaxAmount', "-1"],
  ["multiply", '//cbc:CreditedQuantity', "-1"],
]

[[mutation]]
id = "credit-notes/preceding-invoice-removed"
base = "credit-note"
reason = "Credit note without reference to the preceding invoice"
edits = [["remove", '/*/cac:BillingReference']]

[[mutation]]
id = "credit-notes/preceding-invoice-without-id"
base = "credit-note"
reason = "Preceding invoice reference with an issue date and no identifier (BR-55, UBL-SR-07)"
edits = [["remove", '/*/cac:BillingReference[1]/cac:InvoiceDocumentReference/cbc:ID']]

[[mutation]]
id = "credit-notes/due-date"
base = "credit-note"
reason = "Credit note with a payment due date in its payment means"
edits = [["insert-after", '/*/cac:PaymentMeans[1]/cbc:PaymentMeansCode', "<cbc:PaymentDueDate>2018-03-07</cbc:PaymentDueDate>"]]

[[mutation]]
id = "credit-notes/vat-category-exempt"
base = "credit-note"
reason = "Credit note line exempt (E) at 25 percent (BR-E-05 over credit note lines)"
edits = [["set", '/*/cac:CreditNoteLine[1]/cac:Item/cac:ClassifiedTaxCategory/cbc:ID', "E"]]

[[mutation]]
id = "credit-notes/line-period-end-before-start"
base = "credit-note"
reason = "Credit note line period ending before it starts (BR-30 over credit note lines)"
edits = [
  ["remove-all", '/*/cac:CreditNoteLine[1]/cac:InvoicePeriod'],
  ["insert-after", '/*/cac:CreditNoteLine[1]/cbc:LineExtensionAmount', "<cac:InvoicePeriod><cbc:StartDate>2018-02-07</cbc:StartDate><cbc:EndDate>2018-02-01</cbc:EndDate></cac:InvoicePeriod>"],
]

[[mutation]]
id = "credit-notes/line-allowance-without-reason"
base = "credit-note"
reason = "Credit note line allowance without reason (BR-42 over credit note lines)"
edits = [["insert-before", '/*/cac:CreditNoteLine[1]/cac:Item', "<cac:AllowanceCharge><cbc:ChargeIndicator>false</cbc:ChargeIndicator><cbc:Amount currencyID=\"EUR\">0</cbc:Amount></cac:AllowanceCharge>"]]

[[mutation]]
id = "credit-notes/rounding-negative-half"
base = "credit-note"
reason = "Credit note with negated lines and total, a line half a cent lower: round() of a negative half goes towards zero (BR-CO-10 holds)"
edits = [
  ["multiply", '/*/cac:CreditNoteLine/cbc:LineExtensionAmount', "-1"],
  ["multiply", '/*/cac:LegalMonetaryTotal/cbc:LineExtensionAmount', "-1"],
  ["add", '/*/cac:CreditNoteLine[1]/cbc:LineExtensionAmount', "-0.005"],
]

[[mutation]]
id = "credit-notes/tax-point-date-after-note"
base = "credit-note"
reason = "Credit note with its VAT point date (BT-7) after the type code and the note, where UBL puts it before the type code: schema error only"
edits = [
  ["remove-all", '/*/cbc:TaxPointDate'],
  ["remove-all", '/*/cbc:Note'],
  ["insert-after", '/*/cbc:CreditNoteTypeCode', "<cbc:TaxPointDate>2018-02-08</cbc:TaxPointDate>"],
  ["insert-after", '/*/cbc:CreditNoteTypeCode', "<cbc:Note>Returned goods</cbc:Note>"],
]

[[mutation]]
id = "credit-notes/tax-point-date-before-type-code"
base = "credit-note"
reason = "Control of credit-notes/tax-point-date-after-note: the same VAT point date and note in UBL order"
edits = [
  ["remove-all", '/*/cbc:TaxPointDate'],
  ["remove-all", '/*/cbc:Note'],
  ["insert-before", '/*/cbc:CreditNoteTypeCode', "<cbc:TaxPointDate>2018-02-08</cbc:TaxPointDate>"],
  ["insert-after", '/*/cbc:CreditNoteTypeCode', "<cbc:Note>Returned goods</cbc:Note>"],
]

[[mutation]]
id = "credit-notes/invoice-tax-point-date-before-type-code"
base = "invoice"
reason = "Invoice with its VAT point date (BT-7) before the type code, in credit note order, where UBL puts it after the notes: schema error only"
edits = [
  ["remove-all", '/*/cbc:TaxPointDate'],
  ["remove-all", '/*/cbc:Note'],
  ["insert-before", '/*/cbc:InvoiceTypeCode', "<cbc:TaxPointDate>2018-02-08</cbc:TaxPointDate>"],
  ["insert-after", '/*/cbc:InvoiceTypeCode', "<cbc:Note>Delivered goods</cbc:Note>"],
]

[[mutation]]
id = "credit-notes/invoice-tax-point-date-after-note"
base = "invoice"
reason = "Control of credit-notes/invoice-tax-point-date-before-type-code: the same VAT point date and note in UBL order"
edits = [
  ["remove-all", '/*/cbc:TaxPointDate'],
  ["remove-all", '/*/cbc:Note'],
  ["insert-after", '/*/cbc:InvoiceTypeCode', "<cbc:TaxPointDate>2018-02-08</cbc:TaxPointDate>"],
  ["insert-after", '/*/cbc:InvoiceTypeCode', "<cbc:Note>Delivered goods</cbc:Note>"],
]

