edits = [
  ["remove-all", '/*/cbc:Note'],
  ["insert-after", '/*/cbc:InvoiceTypeCode', "<cbc:Note>x</cbc:Note>"],
  ["set", '/*/cbc:Note', "abcdefghij", "1000"],
]

[[mutation]]
id = "long/invoice-number-5000-characters"
base = "invoice"
reason = "An invoice number of 5000 characters"
edits = [["set", '/*/cbc:ID', "0123456789", "500"]]

[[mutation]]
id = "long/quantity-60-digits"
base = "invoice"
reason = "An invoiced quantity of 60 digits"
edits = [["set", '/*/cac:InvoiceLine[1]/cbc:InvoicedQuantity', "9", "60"]]

[[mutation]]
