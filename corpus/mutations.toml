  ["set", '//cac:ClassifiedTaxCategory/cbc:ID', "G"],
  ["set", '//cac:TaxCategory/cbc:ID', "G"],
  ["set", '//cac:ClassifiedTaxCategory/cbc:Percent', "0"],
  ["set", '//cac:TaxCategory/cbc:Percent', "0"],
  ["set", '//cac:TaxSubtotal/cbc:TaxAmount', "0"],
]

[[mutation]]
id = "vat/not-subject-everywhere"
base = "invoice"
