  ["replace", 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"', 'xmlns:inv="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"'],
  ["rename", '/*', "inv:Invoice"],
]

[[mutation]]
id = "namespaces/credit-note-root-prefixed"
base = "credit-note"
reason = "Credit note element with a prefix instead of the default namespace: same document"
edits = [
  ["replace", 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:CreditNote-2"', 'xmlns:cn="urn:oasis:names:specification:ubl:schema:xsd:CreditNote-2"'],
  ["rename", '/*', "cn:CreditNote"],
]

[[mutation]]
id = "namespaces/cbc-prefix-renamed"
base = "invoice"
reason = "Basic components bound to the prefix b instead of cbc: same document"
edits = [
  ["replace", "<cbc:", "<b:"],
  ["replace", "</cbc:", "</b:"],
  ["replace", "xmlns:cbc=", "xmlns:b="],
]

[[mutation]]
id = "namespaces/cac-prefix-renamed"
base = "credit-note"
reason = "Aggregate components bound to the prefix agg instead of cac: same document"
edits = [
  ["replace", "<cac:", "<agg:"],
  ["replace", "</cac:", "</agg:"],
  ["replace", "xmlns:cac=", "xmlns:agg="],
]

[[mutation]]
id = "namespaces/prefixes-swapped"
base = "invoice"
reason = "The prefixes cbc and cac swapped (cbc names aggregate components): same document"
edits = [
  ["replace", "<cbc:", "<x0:"],
  ["replace", "</cbc:", "</x0:"],
  ["replace", "xmlns:cbc=", "xmlns:x0="],
  ["replace", "<cac:", "<cbc:"],
  ["replace", "</cac:", "</cbc:"],
  ["replace", "xmlns:cac=", "xmlns:cbc="],
  ["replace", "<x0:", "<cac:"],
  ["replace", "</x0:", "</cac:"],
  ["replace", "xmlns:x0=", "xmlns:cac="],
]

[[mutation]]
id = "namespaces/cbc-default-in-totals"
base = "invoice"
reason = "Basic components of the totals in the default namespace, declared on the totals group: same document"
edits = [
  ["set", '/*/cac:LegalMonetaryTotal/@xmlns', "urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2"],
  ["replace-in", '/*/cac:LegalMonetaryTotal', "cbc:", ""],
]

[[mutation]]
id = "namespaces/second-prefix-same-uri"
base = "invoice"
reason = "A second prefix for the basic components namespace, used in the totals: same document"
edits = [
  ["set", '/*/@xmlns:basic', "urn:oasis:names:specification:ubl:schema:xsd:CommonBasicComponents-2"],
  ["replace-in", '/*/cac:LegalMonetaryTotal', "cbc:", "basic:"],
]

[[mutation]]
id = "namespaces/cbc-rebound-in-subtree"
base = "invoice"
reason = "The cbc prefix bound to another namespace inside the first VAT total: its amounts and codes disappear"
edits = [["set", '/*/cac:TaxTotal[1]/@xmlns:cbc', "urn:example:not-ubl"]]

[[mutation]]
id = "namespaces/extra-declarations"
base = "invoice"
reason = "Unused namespace declarations, a redundant redeclaration and an xsi:schemaLocation: same document"
edits = [
  ["set", '/*/@xmlns:xsi', "http://www.w3.org/2001/XMLSchema-instance"],
  ["set", '/*/@xsi:schemaLocation', "urn:oasis:names:specification:ubl:schema:xsd:Invoice-2 UBL-Invoice-2.1.xsd"],
  ["set", '/*/@xmlns:unused', "urn:example:unused"],
  ["set", '/*/cac:InvoiceLine[1]/@xmlns:cac', "urn:oasis:names:specification:ubl:schema:xsd:CommonAggregateComponents-2"],
]

[[mutation]]
id = "namespaces/element-in-wrong-namespace"
base = "invoice"
reason = "Amount due in the aggregate components namespace: it is no longer there (BR-15)"
edits = [["rename", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "cac:PayableAmount"]]

[[mutation]]
id = "namespaces/root-in-credit-note-namespace"
base = "invoice"
reason = "Invoice element in the credit note namespace: no rule context matches it"
edits = [["replace", 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"', 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:CreditNote-2"']]

[[mutation]]
id = "namespaces/root-without-namespace"
base = "invoice"
reason = "Invoice element in no namespace"
edits = [["replace", 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"', 'xmlns:unused="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"']]

[[mutation]]
id = "namespaces/credit-note-root-in-invoice-namespace"
base = "credit-note"
reason = "Credit note element in the invoice namespace"
edits = [["replace", 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:CreditNote-2"', 'xmlns="urn:oasis:names:specification:ubl:schema:xsd:Invoice-2"']]

[[mutation]]
id = "namespaces/attribute-prefixed"
base = "invoice"
reason = "The currency of the amount due as a cbc:currencyID attribute in a namespace, not currencyID"
edits = [["replace-in", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "currencyID=", "cbc:currencyID="]]

# ---------------------------------------------------------------------------------------
# Comments, processing instructions, CDATA, references and whitespace in odd places

[[mutation]]
id = "markup/comment-in-amount"
base = "invoice"
reason = "Amount due split by a comment (0<!--c-->value): the string value is the concatenated text"
edits = [
  ["prefix-xml", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "<!--c-->"],
  ["prefix", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "0"],
]

[[mutation]]
id = "markup/cdata-in-amount"
base = "invoice"
reason = "Amount due starting with a CDATA section holding a leading zero"
edits = [["prefix-xml", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "<![CDATA[0]]>"]]

[[mutation]]
id = "markup/character-reference-in-amount"
base = "invoice"
reason = "Amount due starting with a character reference (&#48;, a leading zero)"
edits = [["prefix-xml", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "&#48;"]]

[[mutation]]
id = "markup/processing-instruction-in-amount"
base = "invoice"
reason = "Amount due starting with a processing instruction"
edits = [["prefix-xml", '/*/cac:LegalMonetaryTotal/cbc:PayableAmount', "<?note amount?>"]]

[[mutation]]
id = "markup/comment-in-code"
base = "invoice"
reason = "Line VAT category code split by comments"
edits = [["set-xml", '/*/cac:InvoiceLine[1]/cac:Item/cac:ClassifiedTaxCategory/cbc:ID', "<!--a-->S<!--b-->"]]

[[mutation]]
id = "markup/cdata-code"
base = "invoice"
reason = "Document currency code written in a CDATA section"
edits = [
  ["replace", "<cbc:DocumentCurrencyCode>", "<cbc:DocumentCurrencyCode><![CDATA["],
  ["replace", "</cbc:DocumentCurrencyCode>", "]]></cbc:DocumentCurrencyCode>"],
]

[[mutation]]
id = "markup/empty-comment-in-every-element"
base = "invoice"
reason = "An empty comment at the start of every element: every text is split, no value changes"
edits = [["prefix-xml", '//*', "<!---->"]]

[[mutation]]
id = "markup/comments-around-root"
base = "invoice"
reason = "Comments and a processing instruction before and after the document element"
edits = [
  ["insert-before", '/*', "<!-- before --><?pi before?>"],
  ["insert-after", '/*', "<!-- after --><?pi after?>"],
]

[[mutation]]
id = "markup/crlf-line-ends"
base = "invoice"
reason = "CR LF line ends everywhere (the parser normalises them to LF)"
edits = [["replace", "\n", "\r\n"]]

[[mutation]]
id = "markup/single-line"
base = "invoice"
reason = "Every line feed removed: no whitespace-only text between elements, notes joined"
edits = [["replace", "\n", ""]]

[[mutation]]
id = "markup/no-xml-declaration"
base = "invoice"
reason = "Document without XML declaration"
edits = [["replace", '<?xml version="1.0" encoding="UTF-8"?>', ""]]

[[mutation]]
id = "markup/byte-order-mark"
base = "invoice"
reason = "Document starting with a UTF-8 byte order mark"
edits = [["replace", '<?xml version="1.0" encoding="UTF-8"?>', "﻿<?xml version=\"1.0\" encoding=\"UTF-8\"?>"]]

[[mutation]]
id = "markup/standalone-declaration"
base = "invoice"
reason = "XML declaration with standalone=\"yes\""
edits = [["replace", '<?xml version="1.0" encoding="UTF-8"?>', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>']]

[[mutation]]
id = "markup/id-whitespace-only"
base = "invoice"
reason = "Invoice number made of spaces only (BR-02 normalises it)"
edits = [["set", '/*/cbc:ID', "   "]]

[[mutation]]
id = "markup/id-tab-newline"
base = "invoice"
reason = "Invoice number made of a tab and a line feed (BR-02)"
edits = [["set", '/*/cbc:ID', "\t\n"]]

[[mutation]]
id = "markup/id-no-break-space"
base = "invoice"
reason = "Invoice number a single no-break space, which normalize-space keeps (BR-02 holds)"
edits = [["set", '/*/cbc:ID', " "]]

[[mutation]]
id = "markup/id-zero-width-space"
base = "invoice"
reason = "Invoice number a single zero-width space"
edits = [["set", '/*/cbc:ID', "​"]]

[[mutation]]
id = "markup/id-character-references"
base = "invoice"
reason = "Invoice number written with character and entity references"
edits = [["set-xml", '/*/cbc:ID', "INV&#45;1&amp;2&#x41;"]]

[[mutation]]
id = "markup/names-with-markup-characters"
base = "invoice"
reason = "Seller and buyer names with ampersands, angle brackets and quotes"
edits = [
  ["set", '/*/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName', "A & B <Seller> \"Ltd\""],
  ["set", '/*/cac:AccountingCustomerParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName', "C 'D' & E > F"],
]

[[mutation]]
id = "markup/names-padded"
base = "invoice"
reason = "Seller legal name surrounded by whitespace"
edits = [
  ["prefix", '/*/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName', " \n\t "],
  ["suffix", '/*/cac:AccountingSupplierParty/cac:Party/cac:PartyLegalEntity/cbc:RegistrationName', "\n "],
]

[[mutation]]
id = "markup/attribute-whitespace-references"
base = "invoice"
reason = "Unit code with tab and line feed character references (kept by attribute value normalisation)"
edits = [["suffix", '/*/cac:InvoiceLine[1]/cbc:InvoicedQuantity/@unitCode', "\t\n"]]

