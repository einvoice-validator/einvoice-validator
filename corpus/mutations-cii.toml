# Mutation catalogue of the CII rule sets: each [[mutation]] derives one test document from a
# base document of a rule set, by a list of edits. Same format as mutations.toml (see
# xtask/src/mutation.rs for the edits and the path syntax, xtask/src/ruleset.rs for the bases);
# the reference engine's results are the goldens of the rule set. Rule ids in reasons name the
# rules aimed at: the goldens record what actually fires.
#
# Bases (CEN examples): invoice = CII_example5.xml (maximum content: two VAT rates, document
# and line allowances and charges, tax currency, prepaid amount, tax representative, payee);
# single = CII_example3.xml (one line, one charge, one VAT breakdown); allowances =
# CII_example2.xml (allowances on lines, prices and document, an exempt line); zero =
# CII_business_example_Z.xml (zero-rated); outside = XRechnung-O.xml (outside the scope of VAT).
# The forbidden/ group at the end adds, for each CII-SR and CII-DT rule of the form not(X), the
# element or attribute X where the rule looks for it, a few rules per mutation.

# ---------------------------------------------------------------------------------------
# Document totals: sums one cent off, in each direction (BR-CO-10 to BR-CO-16)

[[mutation]]
id = "totals/line-total-amount-plus-cent"
base = "invoice"
reason = 'Sum of line net amounts (BT-106) one cent above the computed value (BR-CO-10)'
edits = [['add', '/rsm:CrossIndustryInvoice/rsm:SupplyChainTradeTransaction/ram:ApplicableHeaderTradeSettlement/ram:SpecifiedTradeSettlementHeaderMonetarySummation/ram:LineTotalAmount', '0.01']]

