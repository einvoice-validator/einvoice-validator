# Every upstream this repository pins: the version in use, how to find the
# latest published version, and the files that record the pin.
#
#   scripts/freshness.sh pins   offline: every [[upstream.pin]] below must match
#   scripts/freshness.sh        queries each upstream and prints pinned / latest
#
# Format: a strict subset of TOML that scripts/freshness.sh reads with jq.
# Only `[[upstream]]` and `[[upstream.pin]]` tables, `key = "string"` or
# `key = 'literal string'` lines (no escapes, one line each) and `#` comments;
# anything else is refused. Regular expressions are Oniguruma (jq) and go in
# 'literal strings' so that backslashes stay as written.
#
# [[upstream]] keys
#   name             label in the report (unique)
#   severity         "high": a newer version fails the check (official rule sets)
#                    "info": a newer version is reported, the check passes (tooling)
#   pinned           the version in use
#   source           where the published versions are listed:
#                    "github-release"  GitHub releases of `repository` (drafts and
#                                      pre-releases ignored)
#                    "maven"           maven-metadata.xml of `group`:`artifact` on
#                                      Maven Central
#                    "listing"         the page at `url`
#   version-pattern  regular expression with a group named `v` (the version);
#                    applied to each release tag (github-release), each version
#                    (maven) or the whole page, all matches (listing). Only what
#                    matches is a candidate. Optional except for "listing".
#   series           also report the latest version starting with "<series>."
#   hold             "info" only: the pin is held on purpose; a newer version is
#                    reported as "pinned, newer exists" and opens no issue
#   unused           no file records this pin yet; says so, and no
#                    [[upstream.pin]] may follow
#
# [[upstream.pin]] keys: every match of `pattern` (group `v`) in `file` must
# equal `pinned`; there must be at least one. With compare = "prefix", `v` may
# also be a prefix of `pinned` ending at a dot ("1.99" for "1.99.1").
#
# Versions are compared as the sequence of their digit runs: 9.9.1-8 < 12.10 < 13.1.

